name: Validação Streamlit

on:
  push:
    branches: [ producao, homologacao ]
  pull_request:
    branches: [ producao ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Pega o código do repo
    - uses: actions/checkout@v3

    # 2️⃣ Configura Python
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # 3️⃣ Instala todas as dependências do projeto
    - name: Install dependencies
      run: pip install -r requirements.txt

    # 4️⃣ Verifica código Python com flake8
    - name: Lint code with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # 5️⃣ Testa se o Streamlit consegue iniciar (dry-run)
    - name: Streamlit dry-run
      run: |
        streamlit run app.py --server.headless true --runner.magic-traceback false --max-run-time 1

    - name: Lint code with flake8
      run: flake8 . --exclude env,__pycache__,.venv
    
